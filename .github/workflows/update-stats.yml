<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doc's CFB War Room</title>

<style>
* { box-sizing: border-box; }

body {
  background: #101b2b;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #50e3a4;
}

.subtitle {
  text-align: center;
  color: #aab8ca;
}

.panel {
  background: #1c3048;
  border-radius: 12px;
  padding: 22px;
  margin: 20px auto;
  max-width: 950px;
}

h2 { color: #50e3a4; }

label {
  display: block;
  margin-top: 12px;
}

select,
input {
  background: white;
  color: #101b2b;
  padding: 12px;
  border: none;
  border-radius: 6px;
  margin: 8px 0;
  width: 100%;
}

button {
  background: #50e3a4;
  color: #101b2b;
  border: none;
  padding: 12px 20px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  margin: 8px 8px 8px 0;
}

button:hover { background: #8bf5c6; }

.secondary { background: #dbe7f5; }

.note {
  color: #b7c6d9;
  font-size: 14px;
  line-height: 1.6;
}

.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

th,
td {
  border: 1px solid #45617e;
  padding: 12px;
  text-align: left;
}

th { background: #284664; }

tr:nth-child(even) { background: #243b55; }

.advantage {
  background: #176b49 !important;
  color: white;
  font-weight: bold;
}

.tie { color: #ffe08a; }

.legend {
  display: inline-block;
  background: #176b49;
  padding: 6px 12px;
  border-radius: 6px;
  margin-top: 10px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

/* ================================
   SCHEDULE CONTEXT
   ================================ */

.schedule-context {
  margin-top: 24px;
  background: #15283d;
  border: 1px solid #45617e;
  border-radius: 12px;
  overflow: hidden;
}

.schedule-context-title {
  background: #284664;
  color: #50e3a4;
  font-size: 20px;
  font-weight: bold;
  padding: 14px 16px;
}

.schedule-context-body {
  padding: 16px;
}

.context-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.context-card {
  background: #1c3048;
  border: 1px solid #45617e;
  border-radius: 8px;
  padding: 14px;
}

.context-label {
  color: #aab8ca;
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 7px;
}

.context-value {
  font-size: 20px;
  font-weight: bold;
}

.context-value.aligned {
  color: #50e3a4;
}

.context-value.conflict {
  color: #ffe08a;
}

.context-value.even {
  color: #dbe7f5;
}

.context-note {
  margin-top: 14px;
  background: #101b2b;
  border-left: 4px solid #ffe08a;
  border-radius: 6px;
  padding: 14px;
  color: #dbe7f5;
  line-height: 1.6;
}

.context-explanation {
  margin-top: 10px;
  color: #aab8ca;
  font-size: 13px;
  line-height: 1.5;
}

@media (max-width: 600px) {
  .form-grid,
  .context-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<h1>DOC'S CFB WAR ROOM</h1>
<p class="subtitle">College Football Research & Matchup Analysis</p>

<!-- TEAM COMPARISON -->

<div class="panel">

<h2>Team Comparison</h2>

<label for="away">Away Team</label>
<select id="away"></select>

<label for="home">Home Team</label>
<select id="home"></select>

<button onclick="compareTeams()">Analyze Matchup</button>

<div id="results"></div>

<!-- SPORTSBOOK PANEL -->

<div id="oddsPanel" style="display:none">
  <h2>Sportsbook Lines & Movement</h2>
  <p id="oddsStatus"></p>
  <div id="oddsTables"></div>
</div>

<!-- STATISTICAL COMPARISON -->

<h2>Statistical Comparison</h2>

<div class="table-wrap">
<table>
<thead>
<tr>
  <th>Metric</th>
  <th>Away Team</th>
  <th>Home Team</th>
</tr>
</thead>

<tbody id="statsBody">
<tr>
<td colspan="3">Select two teams and analyze the matchup.</td>
</tr>
</tbody>
</table>
</div>

<p class="legend">Green = Statistical Advantage</p>

<p class="note">
Green identifies the stronger value for an individual statistic.
It does not predict which team will win.
</p>

<p class="note">
PPA = Predicted Points Added per play.
Enter success rates as decimals. For example, 45% = 0.45.
</p>

<!-- SCHEDULE CONTEXT -->

<div id="scheduleContext"
     class="schedule-context"
     style="display:none">

  <div class="schedule-context-title">
    Schedule Context
  </div>

  <div class="schedule-context-body">

    <div class="context-grid">

      <div class="context-card">
        <div class="context-label">
          Raw Statistical Advantage
        </div>
        <div id="rawAdvantage"
             class="context-value">
          —
        </div>
      </div>

      <div class="context-card">
        <div class="context-label">
          Stronger Schedule
        </div>
        <div id="scheduleAdvantage"
             class="context-value">
          —
        </div>
      </div>

      <div class="context-card">
        <div class="context-label">
          SOS Rank Gap
        </div>
        <div id="sosGap"
             class="context-value">
          —
        </div>
      </div>

      <div class="context-card">
        <div class="context-label">
          Schedule Alignment
        </div>
        <div id="scheduleAlignment"
             class="context-value">
          —
        </div>
      </div>

    </div>

    <div id="scheduleNote"
         class="context-note">
    </div>

    <div class="context-explanation">
      Schedule Context compares the direction of the raw statistical
      results with strength of schedule. It does not adjust the
      underlying statistics and is not an opponent-adjusted rating.
    </div>

  </div>
</div>

</div>

<!-- TEAM STATISTICS EDITOR -->

<div class="panel">

<h2>Team Statistics Editor</h2>

<p class="note">
Enter verified statistics. Changes are saved in this browser.
</p>

<label for="editTeam">Select Team</label>
<select id="editTeam"
        onchange="loadTeamEditor()">
</select>

<div class="form-grid">

<div>
<label for="offPPA">Offensive PPA</label>
<input id="offPPA" type="number" step="any">
</div>

<div>
<label for="defPPA">Defensive PPA</label>
<input id="defPPA" type="number" step="any">
</div>

<div>
<label for="successRate">
Offensive Success Rate
</label>
<input id="successRate"
       type="number"
       min="0"
       max="1"
       step="any">
</div>

<div>
<label for="explosiveness">
Offensive Explosiveness
</label>
<input id="explosiveness"
       type="number"
       step="any">
</div>

<div>
<label for="pointsPerOpportunity">
Points per Scoring Opportunity
</label>
<input id="pointsPerOpportunity"
       type="number"
       step="any">
</div>

<div>
<label for="defSuccessRate">
Defensive Success Rate Allowed
</label>
<input id="defSuccessRate"
       type="number"
       min="0"
       max="1"
       step="any">
</div>

<div>
<label for="defExplosiveness">
Defensive Explosiveness Allowed
</label>
<input id="defExplosiveness"
       type="number"
       step="any">
</div>

</div>

<label for="source">Data Source</label>
<input id="source"
       placeholder="Example: CollegeFootballData">

<label for="season">Season</label>
<input id="season"
       type="number"
       min="2000"
       max="2100"
       value="2026">

<label for="verifiedDate">Date Verified</label>
<input id="verifiedDate"
       type="date">

<button onclick="saveTeamStats()">
Save Team Statistics
</button>

<button class="secondary"
        onclick="exportData()">
Export Data Backup
</button>

<p id="saveMessage"
   class="note">
</p>

</div>

<!-- ADD TEAM -->

<div class="panel">

<h2>Add a New Team</h2>

<label for="newTeam">Team Name</label>

<input id="newTeam"
       placeholder="Example: Alabama">

<button onclick="addTeam()">
Add Team
</button>

<p id="addMessage"
   class="note">
</p>

</div>

<!-- EXISTING DATA FILES -->

<script src="teams.js"></script>
<script src="auto-stats.js"></script>

<script>

/* ================================
   DATABASE
   ================================ */

const STORAGE_KEY = "docsCFBWarRoomData";

let warRoomTeams = {};

function emptyTeam() {
  return {
    offense: {
      ppa: null,
      successRate: null,
      explosiveness: null,
      pointsPerOpportunity: null
    },

    defense: {
      ppa: null,
      successRate: null,
      explosiveness: null
    },

    dataInfo: {
      season: 2026,
      source: "",
      lastUpdated: null,
      verified: false
    }
  };
}

function initializeDatabase() {

  if (
    typeof teams !== "undefined" &&
    teams &&
    typeof teams === "object"
  ) {
    warRoomTeams =
      JSON.parse(JSON.stringify(teams));
  }

  try {

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if (saved) {

      const parsed = JSON.parse(saved);

      if (
        parsed &&
        typeof parsed === "object" &&
        !Array.isArray(parsed)
      ) {
        warRoomTeams = {
          ...warRoomTeams,
          ...parsed
        };
      }
    }

  } catch (error) {
    console.warn(
      "Saved browser data unavailable.",
      error
    );
  }

  refreshMenus();
  loadTeamEditor();
}

function persistData() {

  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(warRoomTeams)
    );

    return true;

  } catch (error) {
    console.error(error);
    return false;
  }
}

/* ================================
   TEAM MENUS
   ================================ */

function refreshMenus() {

  const names =
    Object.keys(warRoomTeams).sort();

  const away =
    document.getElementById("away");

  const home =
    document.getElementById("home");

  const editor =
    document.getElementById("editTeam");

  const oldAway = away.value;
  const oldHome = home.value;
  const oldEditor = editor.value;

  [away, home, editor].forEach(menu => {

    menu.innerHTML = "";

    names.forEach(name => {

      const option =
        document.createElement("option");

      option.value = name;
      option.textContent = name;

      menu.appendChild(option);
    });
  });

  if (names.includes(oldAway)) {
    away.value = oldAway;
  }

  if (names.includes(oldHome)) {
    home.value = oldHome;
  } else if (names.length > 1) {
    home.value = names[1];
  }

  if (names.includes(oldEditor)) {
    editor.value = oldEditor;
  }
}

/* ================================
   STATISTICAL COMPARISON
   ================================ */

function displayStat(value) {

  return (
    typeof value === "number" &&
    Number.isFinite(value)
  )
    ? value.toFixed(3)
    : "Awaiting data";
}

/*
higher = higher number has advantage
lower  = lower number has advantage
none   = displayed without automatic advantage
*/

const metrics = [

  {
    label: "Offensive PPA",
    category: "offense",
    key: "ppa",
    direction: "higher"
  },

  {
    label: "Defensive PPA",
    category: "defense",
    key: "ppa",
    direction: "lower"
  },

  {
    label: "Offensive Success Rate",
    category: "offense",
    key: "successRate",
    direction: "higher"
  },

  {
    label: "Offensive Explosiveness",
    category: "offense",
    key: "explosiveness",
    direction: "none"
  },

  {
    label: "Points per Opportunity",
    category: "offense",
    key: "pointsPerOpportunity",
    direction: "higher"
  },

  {
    label: "Defensive Success Rate Allowed",
    category: "defense",
    key: "successRate",
    direction: "lower"
  },

  {
    label: "Defensive Explosiveness Allowed",
    category: "defense",
    key: "explosiveness",
    direction: "none"
  },

  {
    label: "Strength of Schedule (Rank)",
    category: "sos",
    key: "rank",
    direction: "lower"
  }

];

/* ================================
   SCHEDULE CONTEXT
   ================================ */

function calculateScheduleContext(
  awayName,
  homeName,
  awayData,
  homeData
) {

  const panel =
    document.getElementById(
      "scheduleContext"
    );

  const rawElement =
    document.getElementById(
      "rawAdvantage"
    );

  const scheduleElement =
    document.getElementById(
      "scheduleAdvantage"
    );

  const gapElement =
    document.getElementById(
      "sosGap"
    );

  const alignmentElement =
    document.getElementById(
      "scheduleAlignment"
    );

  const noteElement =
    document.getElementById(
      "scheduleNote"
    );

  let awayWins = 0;
  let homeWins = 0;
  let ties = 0;

  /*
  Count only directional performance
  metrics.

  SOS is intentionally excluded because
  it is the separate schedule signal.
  */

  metrics.forEach(metric => {

    if (
      metric.direction === "none" ||
      metric.category === "sos"
    ) {
      return;
    }

    const awayValue =
      awayData?.[metric.category]
        ?.[metric.key];

    const homeValue =
      homeData?.[metric.category]
        ?.[metric.key];

    const valid =
      typeof awayValue === "number" &&
      Number.isFinite(awayValue) &&
      typeof homeValue === "number" &&
      Number.isFinite(homeValue);

    if (!valid) {
      return;
    }

    if (awayValue === homeValue) {
      ties++;
      return;
    }

    if (metric.direction === "higher") {

      if (awayValue > homeValue) {
        awayWins++;
      } else {
        homeWins++;
      }

    } else if (
      metric.direction === "lower"
    ) {

      if (awayValue < homeValue) {
        awayWins++;
      } else {
        homeWins++;
      }
    }
  });

  let rawWinner = "Even";

  if (awayWins > homeWins) {
    rawWinner = awayName;
  } else if (homeWins > awayWins) {
    rawWinner = homeName;
  }

  if (rawWinner === "Even") {

    rawElement.textContent =
      "Even (" +
      awayWins +
      "–" +
      homeWins +
      ")";

  } else {

    rawElement.textContent =
      rawWinner +
      " (" +
      Math.max(awayWins, homeWins) +
      "–" +
      Math.min(awayWins, homeWins) +
      ")";
  }

  const awaySOS =
    awayData?.sos?.rank;

  const homeSOS =
    homeData?.sos?.rank;

  const validSOS =
    typeof awaySOS === "number" &&
    Number.isFinite(awaySOS) &&
    typeof homeSOS === "number" &&
    Number.isFinite(homeSOS);

  panel.style.display = "block";

  if (!validSOS) {

    scheduleElement.textContent =
      "SOS unavailable";

    gapElement.textContent = "—";

    alignmentElement.textContent =
      "Unavailable";

    alignmentElement.className =
      "context-value even";

    noteElement.textContent =
      "Strength-of-schedule data is unavailable for one or both teams. The War Room can display the raw statistical comparison, but it cannot compare that result with schedule strength.";

    return;
  }

  const sosGap =
    Math.abs(awaySOS - homeSOS);

  let scheduleWinner = "Even";

  if (awaySOS < homeSOS) {
    scheduleWinner = awayName;
  } else if (homeSOS < awaySOS) {
    scheduleWinner = homeName;
  }

  if (scheduleWinner === "Even") {

    scheduleElement.textContent =
      "Even (#" +
      awaySOS +
      ")";

  } else {

    const strongerRank =
      Math.min(awaySOS, homeSOS);

    scheduleElement.textContent =
      scheduleWinner +
      " (#" +
      strongerRank +
      ")";
  }

  gapElement.textContent =
    sosGap.toFixed(0) +
    " ranking positions";

  /*
  Alignment is descriptive only.

  ALIGNED:
  raw-stat leader also owns stronger SOS.

  CONFLICT:
  raw-stat leader and stronger-SOS team
  are different.

  EVEN:
  raw stats or SOS do not identify
  different leaders.
  */

  let alignment = "EVEN";
  let alignmentClass =
    "context-value even";

  if (
    rawWinner !== "Even" &&
    scheduleWinner !== "Even"
  ) {

    if (rawWinner === scheduleWinner) {

      alignment = "ALIGNED";
      alignmentClass =
        "context-value aligned";

    } else {

      alignment = "CONFLICT";
      alignmentClass =
        "context-value conflict";
    }
  }

  alignmentElement.textContent =
    alignment;

  alignmentElement.className =
    alignmentClass;

  let note = "";

  if (
    rawWinner === "Even" &&
    scheduleWinner === "Even"
  ) {

    note =
      "The comparable raw metrics are even and the teams have the same SOS rank.";

  } else if (rawWinner === "Even") {

    note =
      "The comparable raw metrics do not produce a clear leader, while " +
      scheduleWinner +
      " has faced the stronger schedule.";

  } else if (scheduleWinner === "Even") {

    note =
      rawWinner +
      " leads the comparable raw metrics, while the teams have the same SOS rank.";

  } else if (
    rawWinner === scheduleWinner
  ) {

    note =
      rawWinner +
      " leads the comparable raw metrics and has also faced the stronger schedule. The raw-stat and schedule signals point in the same direction.";

  } else {

    note =
      rawWinner +
      " leads the comparable raw metrics, while " +
      scheduleWinner +
      " has faced the stronger schedule. The raw-stat and schedule signals therefore point in different directions.";
  }

  noteElement.textContent = note;
}

/* ================================
   MAIN MATCHUP ANALYSIS
   ================================ */

function compareTeams() {

  const awayName =
    document.getElementById("away").value;

  const homeName =
    document.getElementById("home").value;

  const results =
    document.getElementById("results");

  const statsBody =
    document.getElementById(
      "statsBody"
    );

  const scheduleContext =
    document.getElementById(
      "scheduleContext"
    );

  scheduleContext.style.display =
    "none";

  if (!awayName || !homeName) {

    results.textContent =
      "Please add at least two teams.";

    statsBody.innerHTML = "";

    return;
  }

  if (awayName === homeName) {

    results.textContent =
      "Please select two different teams.";

    statsBody.innerHTML = "";

    return;
  }

  const awayData =
    warRoomTeams[awayName];

  const homeData =
    warRoomTeams[homeName];

  if (!awayData || !homeData) {

    results.textContent =
      "Team data could not be found.";

    return;
  }

  results.innerHTML = "";

  const heading =
    document.createElement("h3");

  heading.textContent =
    awayName +
    " vs " +
    homeName;

  results.appendChild(heading);

  statsBody.innerHTML = "";

  metrics.forEach(metric => {

    const awayValue =
      awayData?.[metric.category]
        ?.[metric.key];

    const homeValue =
      homeData?.[metric.category]
        ?.[metric.key];

    const row =
      document.createElement("tr");

    const labelCell =
      document.createElement("td");

    const awayCell =
      document.createElement("td");

    const homeCell =
      document.createElement("td");

    labelCell.textContent =
      metric.label;

    awayCell.textContent =
      displayStat(awayValue);

    homeCell.textContent =
      displayStat(homeValue);

    const valid =
      typeof awayValue === "number" &&
      Number.isFinite(awayValue) &&
      typeof homeValue === "number" &&
      Number.isFinite(homeValue);

    if (
      valid &&
      metric.direction !== "none"
    ) {

      if (awayValue === homeValue) {

        awayCell.classList.add("tie");
        homeCell.classList.add("tie");

      } else {

        let awayAdvantage = false;

        if (
          metric.direction === "higher"
        ) {
          awayAdvantage =
            awayValue > homeValue;
        }

        if (
          metric.direction === "lower"
        ) {
          awayAdvantage =
            awayValue < homeValue;
        }

        if (awayAdvantage) {
          awayCell.classList.add(
            "advantage"
          );
        } else {
          homeCell.classList.add(
            "advantage"
          );
        }
      }
    }

    row.appendChild(labelCell);
    row.appendChild(awayCell);
    row.appendChild(homeCell);

    statsBody.appendChild(row);
  });

  calculateScheduleContext(
    awayName,
    homeName,
    awayData,
    homeData
  );
}

/* ================================
   STATISTICS EDITOR
   ================================ */

function loadTeamEditor() {

  const name =
    document.getElementById(
      "editTeam"
    ).value;

  const team =
    warRoomTeams[name];

  if (!team) {
    return;
  }

  const offense =
    team.offense || {};

  const defense =
    team.defense || {};

  const info = {
    ...emptyTeam().dataInfo,
    ...(typeof dataInfo !== "undefined"
      ? dataInfo
      : {}),
    ...(team.dataInfo || {})
  };

  const fields = {

    offPPA:
      offense.ppa,

    defPPA:
      defense.ppa,

    successRate:
      offense.successRate,

    explosiveness:
      offense.explosiveness,

    pointsPerOpportunity:
      offense.pointsPerOpportunity,

    defSuccessRate:
      defense.successRate,

    defExplosiveness:
      defense.explosiveness
  };

  Object.entries(fields).forEach(
    ([id, value]) => {

      document.getElementById(id).value =
        typeof value === "number"
          ? value
          : "";
    }
  );

  document.getElementById(
    "source"
  ).value =
    info.source || "";

  document.getElementById(
    "season"
  ).value =
    info.season || 2026;

  document.getElementById(
    "verifiedDate"
  ).value =
    info.lastUpdated || "";

  document.getElementById(
    "saveMessage"
  ).textContent = "";
}

function readNumber(id) {

  const raw =
    document.getElementById(id)
      .value.trim();

  if (raw === "") {
    return null;
  }

  const value = Number(raw);

  if (!Number.isFinite(value)) {
    throw new Error(
      "Invalid number in " + id
    );
  }

  return value;
}

function saveTeamStats() {

  const name =
    document.getElementById(
      "editTeam"
    ).value;

  if (!name) {
    return;
  }

  const message =
    document.getElementById(
      "saveMessage"
    );

  let values;

  try {

    values = {

      offPPA:
        readNumber("offPPA"),

      defPPA:
        readNumber("defPPA"),

      successRate:
        readNumber("successRate"),

      explosiveness:
        readNumber("explosiveness"),

      pointsPerOpportunity:
        readNumber(
          "pointsPerOpportunity"
        ),

      defSuccessRate:
        readNumber(
          "defSuccessRate"
        ),

      defExplosiveness:
        readNumber(
          "defExplosiveness"
        )
    };

  } catch (error) {

    message.textContent =
      error.message;

    return;
  }

  for (
    const key of [
      "successRate",
      "defSuccessRate"
    ]
  ) {

    const value = values[key];

    if (
      value !== null &&
      (value < 0 || value > 1)
    ) {

      message.textContent =
        "Success rates must be between 0 and 1.";

      return;
    }
  }

  const original =
    warRoomTeams[name] ||
    emptyTeam();

  const source =
    document.getElementById(
      "source"
    ).value.trim();

  const season =
    Number(
      document.getElementById(
        "season"
      ).value
    );

  const date =
    document.getElementById(
      "verifiedDate"
    ).value;

  if (
    !Number.isInteger(season) ||
    season < 2000 ||
    season > 2100
  ) {

    message.textContent =
      "Please enter a valid season.";

    return;
  }

  warRoomTeams[name] = {

    ...original,

    offense: {
      ...original.offense,

      ppa:
        values.offPPA,

      successRate:
        values.successRate,

      explosiveness:
        values.explosiveness,

      pointsPerOpportunity:
        values.pointsPerOpportunity
    },

    defense: {
      ...original.defense,

      ppa:
        values.defPPA,

      successRate:
        values.defSuccessRate,

      explosiveness:
        values.defExplosiveness
    },

    dataInfo: {
      season: season,
      source: source,
      lastUpdated: date || null,
      verified: Boolean(
        source && date
      )
    }
  };

  if (persistData()) {

    message.textContent =
      name +
      " saved successfully!";

  } else {

    message.textContent =
      "Browser storage failed. Export a backup.";
  }

  compareTeams();
}

/* ================================
   ADD NEW TEAM
   ================================ */

function addTeam() {

  const input =
    document.getElementById(
      "newTeam"
    );

  const message =
    document.getElementById(
      "addMessage"
    );

  const name =
    input.value.trim();

  if (!name) {

    message.textContent =
      "Enter a team name.";

    return;
  }

  const existing =
    Object.keys(warRoomTeams).find(
      team =>
        team.toLowerCase() ===
        name.toLowerCase()
    );

  if (existing) {

    message.textContent =
      "That team already exists.";

    return;
  }

  warRoomTeams[name] =
    emptyTeam();

  const saved =
    persistData();

  refreshMenus();

  document.getElementById(
    "editTeam"
  ).value = name;

  loadTeamEditor();

  message.textContent =
    saved
      ? name +
        " added successfully!"
      : "Team added for this session. Export a backup.";

  input.value = "";
}

/* ================================
   EXPORT BACKUP
   ================================ */

function exportData() {

  const content =
    JSON.stringify(
      warRoomTeams,
      null,
      2
    );

  const blob =
    new Blob(
      [content],
      {
        type: "application/json"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  link.href = url;

  link.download =
    "docs-cfb-war-room-backup.json";

  document.body.appendChild(link);

  link.click();
  link.remove();

  setTimeout(
    () =>
      URL.revokeObjectURL(url),
    1000
  );
}

/* ================================
   START WAR ROOM
   ================================ */

initializeDatabase();

</script>

<script src="odds.js"></script>

</body>
